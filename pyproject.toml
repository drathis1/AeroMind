[project]
name = "aeromind"
version = "0.1.0"
description = "AeroMind — agentic air cargo operations (Phase 2/3 scaffold)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0.25",
  "asyncpg>=0.29",
  "greenlet>=3.0",
  "langgraph>=0.2.40",
  "google-genai>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aeromind*"]
